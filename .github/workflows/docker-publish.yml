name: Publish Docker image

# Builds the ultra-lite image (embedded frontend, no OCR/LibreOffice) from
# source and publishes it to GitHub Container Registry as
#   ghcr.io/shutovbro/aziralpdf-app:latest
#   ghcr.io/shutovbro/aziralpdf-app:sha-<commit>
# then, if the HF_SPACE variable is set, redeploys the Hugging Face demo
# Space from that image.
#
# One-time setup for the demo:
#   1. After the first successful run make the package public:
#      github.com/shutovBro?tab=packages → aziralpdf-app → Package settings →
#      Change visibility → Public. Hugging Face pulls it anonymously.
#   2. Create a Space: huggingface.co/new-space → SDK "Docker" → "Blank".
#   3. Repository variable HF_SPACE = <hf-user>/<space-name>
#      Repository secret   HF_TOKEN = Hugging Face token with "write" access.

on:
  push:
    branches: [rebrand/aziralpdf, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/shutovbro/aziralpdf-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the Gradle + Node build needs it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push (ultra-lite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/embedded/Dockerfile.ultra-lite
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          build-args: |
            VERSION_TAG=${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: build
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space tree
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/space && mkdir /tmp/space
          # Pin the freshly built tag so every deploy changes the Dockerfile
          # and Hugging Face actually rebuilds.
          sed "s|__IMAGE_TAG__|${TAG}|" deploy/huggingface/Dockerfile > /tmp/space/Dockerfile
          cp deploy/huggingface/README.md /tmp/space/README.md

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
